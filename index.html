<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Rectangle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- The hover zone stays fixed while the rectangle moves. -->
    <div class="hover-zone">
        <!-- Invisible trigger area: only hovering this strip moves the rectangle. -->
        <div class="hover-trigger" aria-hidden="false"></div>
        <div class="rectangle"></div>
    </div>

        <!-- The hover zone stays fixed while the rectangle moves. -->
    <div class="hover-zone2">
        <!-- Invisible trigger area: only hovering this strip moves the rectangle. -->
        <div class="hover-trigger2" aria-hidden="false"></div>
        <div class="rectangle2"></div>
    </div>
</body>
</html>
